appId: com.apkbuddystart.win
productName: ApkBuddyStart
copyright: Copyright © 2026 Cosio33 (basado en RoutineMiku, MIT)

directories:
  output: dist/release
  buildResources: build

# Solo se incluyen los archivos necesarios para ejecutar; el directorio de código fuente entra completo (sin asar: el agente de ventana necesita la ruta real del .ps1)
asar: false
files:
  - src/**/*
  - package.json
  - LICENSE
  - "!**/*.map"
  - "!**/node_modules/**"
  # Para descomprimir imágenes .xz en tiempo de ejecución (NAPI preconstruido, sin problemas de ABI)
  - "node_modules/@napi-rs/lzma/**"
  - "node_modules/@napi-rs/lzma-win32-x64-msvc/**"
  - "!node_modules/@napi-rs/lzma/*.md"
  - "!node_modules/@napi-rs/lzma/*.ts"
  - "!node_modules/@napi-rs/lzma/browser-entry.*"

# Conservar solo los idiomas de interfaz chino e inglés (los locales de Electron pasan de 41 MB a ~3 MB)
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US

# Runtime completo (emulator + platform-tools + imagen del sistema), generado por build/prepare-runtime.js.
# Al incluirlo en el paquete, el primer arranque no requiere ninguna descarga.
extraResources:
  - from: build/runtime
    to: runtime
    filter:
      - "**/*"
      - "!.prepared"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: src/ui/assets/appicon.ico
  # Instalar en el directorio del usuario actual, sin escribir en la unidad del sistema ni pedir permisos de administrador
  requestedExecutionLevel: asInvoker

# ---------------- Microsoft Store (MSIX) ----------------
# El objetivo appx no está en la lista de compilación predeterminada: solo se usa al generar el
# paquete de la tienda (npm run build:appx); normalmente npm run build:exe solo produce el
# instalador NSIS.
#
# identityName / publisher deben coincidir literalmente con
#   Partner Center → Product management → Product identity →
#   Package/Identity/Name y Package/Identity/Publisher.
# Los dos valores siguientes son los confirmados, copiados de Partner Center el 2026-11-16;
# al cambiar la identidad del producto, modifícalos aquí (o define APKSTART_MSIX_IDENTITY /
# APKSTART_MSIX_PUBLISHER).
# Atención: la tienda rechazará directamente los paquetes con el Publisher de marcador de posición (CN=RoutineMiku).
appx:
  identityName: Cosio33.ApkBuddyStart
  publisher: "CN=58CA1DED-8AB3-4D0D-AF50-62C9B781AA4D"
  publisherDisplayName: Cosio33
  displayName: ApkBuddyStart
  applicationId: ApkBuddyStart
  # La única capacidad obligatoria para una aplicación de escritorio de plena confianza. No añadir
  # unvirtualizedResources / broadFileSystemAccess: la tienda prácticamente nunca las aprueba, y
  # esta aplicación ya evita la redirección de escritura de AppData moviendo el directorio de datos
  # a %USERPROFILE%\ApkBuddyStart, así que no las necesita.
  capabilities:
    - runFullTrust
  languages:
    - zh-CN
    - en-US
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.22621.0

nsis:
  # Ya no es la «instalación de un clic en el directorio predeterminado de C:»: ahora se usa un
  # asistente estándar que permite elegir la ubicación de instalación (instalar en una unidad que
  # no sea del sistema alivia la carga de C:; el directorio de datos del runtime se especifica por
  # separado en los ajustes).
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  displayLanguageSelector: false
  # always: reconstruir el acceso directo incluso si ya existe un .lnk con el mismo nombre en el
  # escritorio. El valor predeterminado true solo lo crea cuando «no existe», lo que en algunas
  # máquinas (bloqueo por software de seguridad, escritorio redirigido a OneDrive, restos de una
  # versión anterior con accesos directos rotos que apuntan a un directorio borrado) hace que no
  # aparezca el icono tras instalar o que el icono siga apuntando al exe antiguo. always garantiza
  # que cada instalación apunte al directorio de instalación actual.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: ApkBuddyStart-${version}-Setup.exe
  # Antes de desinstalar, terminar los procesos del runtime que sigan en ejecución para evitar que
  # los archivos queden bloqueados y no se puedan borrar (si tools como Huorong no pueden eliminarlos,
  # lo más probable es que los procesos qemu/adb sigan residentes).
  include: build/installer.nsh
  # El propio instalador ya incluye el runtime completo (emulator + imagen del sistema .gz);
  # tras instalar, el primer arranque extrae automáticamente la imagen al directorio del usuario y
  # a partir de entonces no se descarga nada de la red.

# Nivel de compresión: normal (zlib). Las imágenes ya son xz/gz y esta capa NSIS solo comprime
# los dll de Electron; la diferencia de tamaño entre normal y maximum es mínima, pero maximum
# (LZMA) hace que construir el instalador tarde más de diez minutos.
# Nota: cuando CI ejecuta npx con PowerShell, la opción en línea -c.compression=xxx se divide en
# argumentos y se interpreta como una ruta de archivo de configuración; por eso el nivel de
# compresión se fija aquí de forma centralizada y no se sobrescribe con -c en el workflow.
compression: normal

# ---------------- Linux / FydeOS ----------------
# Esta sección estaba antes en el campo "build" de package.json. El esquema de electron-builder
# 26 ya no acepta la forma de linux.desktop, lo que hacía que cualquier compilación (incluso en
# Windows) fallara directamente en la fase de validación de la configuración. Al moverla aquí de
# forma centralizada y especificarla explícitamente con --config electron-builder.yml, la antigua
# configuración de package.json ya no la sobrescribe.
linux:
  target:
    - AppImage
  category: Utility
  icon: src/ui/assets/logo-128.png
  desktop:
    entry:
      Name: ApkBuddyStart
      Comment: Gestionar aplicaciones Android en FydeOS / Linux
      Categories: Utility;
