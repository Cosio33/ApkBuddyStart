# CI del puerto a Rust de ApkBuddyStart.
#
# Compila y verifica cada crate de rust/ en GitHub Actions (windows-latest), de modo que el
# .node generado sea cargable en Windows. Ejecuta el ciclo completo del método:
#   record (si no hay cases.jsonl) -> build -> diff -> bench -> gate
#
# La grabación del original se versiona en cases.jsonl; no se regraba en cada push para que
# diff compare siempre contra la misma referencia.

name: rust-port

on:
  workflow_dispatch:
  push:
    paths:
      - 'rust/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/rust-port.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/rust-port.yml'

env:
  RA_VERSION: '1.5.1'

jobs:
  port:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ['rust/backends-rs']

    steps:
      - uses: actions/checkout@v4

      - name: Install rust-anything
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/erkamyaman/rust-anything/releases/download/v${env:RA_VERSION}/rust-anything-v${env:RA_VERSION}-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile ra.zip
          Expand-Archive -Path ra.zip -DestinationPath ra-bin -Force
          $bin = Get-ChildItem -Path ra-bin -Recurse -Filter rust-anything.exe | Select-Object -First 1
          if (-not $bin) { throw "rust-anything.exe not found in release archive" }
          $dir = Join-Path $env:RUNNER_TEMP 'ra'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $bin.FullName (Join-Path $dir 'rust-anything.exe') -Force
          echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rust-anything --version

      - name: Setup Node (runtime del original)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/* -> target

      - name: Record (solo si no hay grabación)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($c in @('${{ matrix.crate }}')) {
            if (-not (Test-Path (Join-Path $c 'cases.jsonl'))) {
              rust-anything record $c
            } else {
              Write-Host "cases.jsonl ya existe en $c; se reutiliza"
            }
          }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($c in @('${{ matrix.crate }}')) { rust-anything build $c }

      - name: Diff (paridad contra el original)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($c in @('${{ matrix.crate }}')) { rust-anything diff $c }

      - name: Bench (informativo)
        shell: pwsh
        run: |
          foreach ($c in @('${{ matrix.crate }}')) { rust-anything bench $c }
        continue-on-error: true

      - name: Gate (fmt, clippy, tests, API, paridad)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($c in @('${{ matrix.crate }}')) { rust-anything gate $c }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-port-${{ matrix.crate }}
          path: |
            rust/*/target/**/*.node
            rust/*/*.node
            rust/*/cases.jsonl
          if-no-files-found: ignore
