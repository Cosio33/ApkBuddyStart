name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar la versión portable y publicar
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (incluye el runtime de Electron)
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Pruebas
        run: npm test

      - name: Empaquetar la versión portable
        run: npm run pack

      # Usar 7-Zip en lugar de Compress-Archive: en el mismo directorio, .NET deflate genera 105 MB,
      # mientras que 7-Zip -mx=9 solo necesita 99,6 MB — esos 5 MB deciden si en Gitee se publica
      # «un zip que se descomprime directamente» o «dos partes que hay que unir a mano». build/zip.js
      # incluye además un límite de tamaño: superar 100 MiB hace fallar el job de inmediato,
      # para evitar que en el futuro se vuelva a recurrir silenciosamente a los paquetes fragmentados.
      - name: Comprimir los artefactos (7-Zip, límite de 100 MiB)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          node build/zip.js dist/ApkBuddyStart-win64-portable "ApkBuddyStart-$tag-win64-portable.zip" --limit-mb 100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "ApkBuddyStart-$tag-win64-portable.zip" | Select-Object Name, Length

      # Crear el Release y subir la versión portable ligera (la carcasa es mínima; el runtime se descarga bajo demanda en el primer inicio)
      - name: Crear Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "ApkBuddyStart-$tag-win64-portable.zip"
          # Idempotente: si el release ya existe (por reejecución o reenvío del tag), se omite create y solo se suben los archivos
          $existing = gh release view $tag --json tagName -q .tagName 2>$null
          # Si hay notas de lanzamiento escritas a mano (.github/release-notes-<tag>.md), se usan:
          # son mucho más útiles que el «Full Changelog» de --generate-notes; si no hay, se genera automáticamente.
          $notes = ".github/release-notes-$tag.md"
          if (-not $existing) {
            if (Test-Path $notes) {
              gh release create $tag --title "ApkBuddyStart $tag" --notes-file $notes
            } else {
              gh release create $tag --title "ApkBuddyStart $tag" --generate-notes
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 15 }
          }
          if (-not $ok) { Write-Error "Fallo al subir: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[].name'

      # Sincronizar con Gitee: desde China la conexión directa a GitHub va a solo decenas de KB/s, mientras que Gitee suele alcanzar varios MB/s.
      # El paquete portable comprimido ronda los 99,6 MB y está dentro del límite de 100 MB por archivo de Gitee, así se publica
      # un único paquete íntegro que el usuario puede descomprimir directamente; publish-gitee.js solo recurre a .part1/.part2 si se excede el límite.
      # El Setup (1,4 GB) y el runtime íntegro (1,4 GB) superan con creces el límite y solo se quedan en GitHub —
      # la parte de aplicación toma la unión de «qué fuente tiene cada archivo», así que esto no afecta a las actualizaciones.
      # La sincronización con Gitee solo avisa, sin bloquear, ante «falta de token / red caída»: si no, todo el job build se pone en rojo,
      # el job full (needs: build) se salta por completo y ni siquiera se publican el Setup y el runtime de GitHub.
      # Sin token, este paso sigue marcándose en rojo en el registro (continue-on-error significa «visible pero no fatal»), sin silenciarse.
      - name: Sincronizar la versión portable a Gitee
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: pwsh
        run: |
          # Antes aquí se hacía «si no hay token, omitir en silencio y que el paso siga pareciendo exitoso» —
          # así fue como en v0.3.4 faltó discretamente una versión en Gitee y solo se descubrió después.
          # Ahora, sin token, el paso falla directamente: preferimos un aviso rojo antes que otro silencio.
          if (-not $env:GITEE_TOKEN) {
            Write-Error "Falta GITEE_TOKEN: esta versión no tendrá paquete en Gitee. Añade GITEE_TOKEN en Settings → Secrets and variables → Actions (basta con el permiso releases, además de projects + pull_requests)."
            exit 1
          }
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          # Usar las mismas notas de lanzamiento que en GitHub; que Gitee no se quede solo con una frase tipo «paquete portable»
          $notes = ".github/release-notes-$tag.md"
          if (Test-Path $notes) {
            node tools/publish-gitee.js $tag --zip "ApkBuddyStart-$tag-win64-portable.zip" --notes $notes
          } else {
            node tools/publish-gitee.js $tag --zip "ApkBuddyStart-$tag-win64-portable.zip"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  full:
    name: Compilar la versión completa (runtime incluido, lista para usar sin conexión)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # Ensamblar el runtime desde las fuentes oficiales de Google (emulator + platform-tools + aehd + imagen Play x86_64).
      # La salida va a engine/, con la misma estructura de directorios que en el desarrollo local.
      - name: Ensamblar el runtime
        run: node build/fetch-runtime.js engine

      # prepare-runtime comprime system.img/vendor.img con xz (LZMA2).
      # El runner de CI solo tiene 2 núcleos: XZ_PRESET=6 reduce el tiempo de compresión de ~2 h a ~40 min (+3 % de tamaño).
      # XZ_TIMEOUT_MS es un perro guardián: si se agota el tiempo, mata el proceso y recurre a gzip,
      # para no repetir nunca más el «stdin sin EOF → salida de 0 bytes → colgado durante 3 horas».
      - name: Preparar el runtime (compresión xz, nivel reducido para acelerar la CI)
        run: node build/prepare-runtime.js --force
        env:
          XZ_PRESET: '6'
          XZ_TIMEOUT_MS: '3600000'

      # Incluir el runtime de Microsoft VC++ 2015-2022 x64: tanto el emulador de Android (Qt6) como qemu lo necesitan,
      # y sin él los programas no arrancan «en otros equipos» (0xc0000135 / falta MSVCP140).
      # Se coloca dentro de build/runtime y se empaqueta en el instalador con extraResources; permite instalar con un clic incluso sin conexión.
      - name: Descargar el runtime de VC++ (incluido sin conexión)
        shell: pwsh
        run: |
          $dir = "build\runtime"
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          $out = "$dir\vc_redist.x64.exe"
          Write-Output "Descargando el runtime de VC++ 2015-2022 x64…"
          curl.exe -L -o $out "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 1MB) { Write-Error "Fallo al descargar vc_redist" }
          Get-Item $out | Select-Object Name, Length

      # Sin etiqueta git, electron-builder no publica de forma implícita; con etiqueta, este job falla de todos modos porque
      # no tiene GH_TOKEN y sale con "GitHub Personal Access Token is not set" y código 1 (la causa de que la versión completa fallara siempre).
      # Aquí se usa --publish never de forma explícita; el instalador lo sube después el paso «Subir la versión completa a Release» con gh release upload.
      - name: Compilar el instalador de la versión completa
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Subir la versión completa a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $setup = Get-ChildItem dist/release/*Setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "No se encontró Setup.exe"; exit 1 }
          Write-Output ("Subiendo {0} ({1:N0} MB)" -f $setup.Name, ($setup.Length / 1MB))
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $setup.FullName --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "Fallo al subir: $($setup.Name)"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'

      # La versión ligera (sin runtime) ya no descarga emulator / imágenes del sistema una a una desde dl.google.com,
      # sino directamente este único paquete íntegro: la fuente de descarga y «actualizaciones de software» coinciden
      # en el mismo Release de GitHub del proyecto, de modo que la estabilidad de la red en China y la resolución
      # de incidencias se concentran en un solo lugar.
      # El contenido ya son imágenes comprimidas con .xz; aquí se usa bsdtar para crear el zip directamente (sin comprimir dos veces, ahorrando decenas de minutos).
      - name: Empaquetar el runtime íntegro (fuente de descarga de la versión ligera)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "ApkBuddyStart-runtime-$tag.zip"
          if (-not (Test-Path "build\runtime\emulator\emulator.exe")) { Write-Error "build\runtime está incompleto"; exit 1 }
          tar.exe -a -cf $zip -C "build\runtime" .
          if ($LASTEXITCODE -ne 0) { Write-Error "Falló al empaquetar el runtime"; exit 1 }
          Get-Item $zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Subir el runtime íntegro a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "ApkBuddyStart-runtime-$tag.zip"
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "Fallo al subir: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'
